syntax = "proto3";
package web;

option go_package = "web/v1;web";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

// 用户服务
service User {
  // 获取登录用户详情接口
  rpc Detail(UserDetailRequest) returns (UserDetailResponse) {
    option (google.api.http) = {
      post: "/api/v1/user/detail"
      body: "*"
    };
  }

  // 获取用户配置信息接口
  rpc Setting(UserSettingRequest) returns (UserSettingResponse) {
    option (google.api.http) = {
      post: "/api/v1/user/setting"
      body: "*"
    };
  }

  // 更新用户信息接口
  rpc DetailUpdate(UserDetailUpdateRequest) returns (UserDetailUpdateResponse) {
    option (google.api.http) = {
      post: "/api/v1/user/detail-update"
      body: "*"
    };
  }

  // 更新用户密码接口
  rpc PasswordUpdate(UserPasswordUpdateRequest) returns (UserPasswordUpdateResponse) {
    option (google.api.http) = {
      post: "/api/v1/user/password-update"
      body: "*"
    };
  }

  // 更新用户手机号接口
  rpc MobileUpdate(UserMobileUpdateRequest) returns (UserMobileUpdateResponse) {
    option (google.api.http) = {
      post: "/api/v1/user/mobile-update"
      body: "*"
    };
  }

  // 更新用户邮箱接口
  rpc EmailUpdate(UserEmailUpdateRequest) returns (UserEmailUpdateResponse) {
    option (google.api.http) = {
      post: "/api/v1/user/email-update"
      body: "*"
    };
  }

  // 商户入驻申请
  rpc MerchantApply(MerchantApplyRequest) returns (MerchantApplyResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/apply"
      body: "*"
    };
  }

  // 查询本人最近一次商户申请状态
  rpc MerchantStatus(MerchantStatusRequest) returns (MerchantStatusResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/status"
      body: "*"
    };
  }

  // 获取本人商户资料（供查看/编辑表单回填，字段与 merchant 表一致）
  rpc MerchantProfile(MerchantProfileRequest) returns (MerchantStatusResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/profile"
      body: "*"
    };
  }

  // 发布商户挂售任务
  rpc MerchantTaskCreate(MerchantTaskCreateRequest) returns (MerchantTaskCreateResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/task/create"
      body: "*"
    };
  }
  // 本人商户任务列表
  rpc MerchantTaskMyList(MerchantTaskMyListRequest) returns (MerchantTaskListResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/task/my-list"
      body: "*"
    };
  }
  // 全平台：已上架且待交易的任务列表
  rpc MerchantTaskMarketList(MerchantTaskMarketListRequest) returns (MerchantTaskListResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/task/market-list"
      body: "*"
    };
  }
  // 任务详情（按 id）
  rpc MerchantTaskDetail(MerchantTaskDetailRequest) returns (MerchantTaskItem) {
    option (google.api.http) = {
      post: "/api/v1/merchant/task/detail"
      body: "*"
    };
  }
  // 买家：按挂单 task_id 查看对应商户公开信息
  rpc MerchantInfoByTask(MerchantInfoByTaskRequest) returns (MerchantInfoForBuyerResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/task/merchant-info"
      body: "*"
    };
  }
  // 修改自己的任务（仅待交易且未删除）
  rpc MerchantTaskUpdate(MerchantTaskUpdateRequest) returns (MerchantTaskUpdateResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/task/update"
      body: "*"
    };
  }
  // 上架自己的任务
  rpc MerchantTaskUp(MerchantTaskIdRequest) returns (MerchantTaskActionResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/task/up"
      body: "*"
    };
  }
  // 下架自己的任务
  rpc MerchantTaskDown(MerchantTaskIdRequest) returns (MerchantTaskActionResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/task/down"
      body: "*"
    };
  }
  // 结束自己的任务（软删除，不再展示）
  rpc MerchantTaskFinish(MerchantTaskIdRequest) returns (MerchantTaskActionResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/task/finish"
      body: "*"
    };
  }

  // 商户收款方式：创建
  rpc MerchantPaytypeCreate(MerchantPaytypeCreateRequest) returns (MerchantPaytypeCreateResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/paytype/create"
      body: "*"
    };
  }
  // 商户收款方式：编辑
  rpc MerchantPaytypeUpdate(MerchantPaytypeUpdateRequest) returns (MerchantPaytypeUpdateResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/paytype/update"
      body: "*"
    };
  }
  // 商户收款方式：列表（本人全部，含已作废，不分页）
  rpc MerchantPaytypeList(MerchantPaytypeListRequest) returns (MerchantPaytypeListResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/paytype/list"
      body: "*"
    };
  }
  // 商户收款方式：作废
  rpc MerchantPaytypeInvalidate(MerchantPaytypeInvalidateRequest) returns (MerchantPaytypeInvalidateResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/paytype/invalidate"
      body: "*"
    };
  }

  // 商户订单：创建（整单购买，挂单变为交易中）
  rpc MerchantOrderCreate(MerchantOrderCreateRequest) returns (MerchantOrderCreateResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/order/create"
      body: "*"
    };
  }
  rpc MerchantOrderDetail(MerchantOrderDetailRequest) returns (MerchantOrderItem) {
    option (google.api.http) = {
      post: "/api/v1/merchant/order/detail"
      body: "*"
    };
  }
  rpc MerchantOrderCancel(MerchantOrderCancelRequest) returns (MerchantOrderActionResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/order/cancel"
      body: "*"
    };
  }
  rpc MerchantOrderList(MerchantOrderListRequest) returns (MerchantOrderListResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/order/list"
      body: "*"
    };
  }
  rpc MerchantOrderConfirmPay(MerchantOrderConfirmPayRequest) returns (MerchantOrderActionResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/order/confirm-pay"
      body: "*"
    };
  }
  rpc MerchantOrderUrge(MerchantOrderIdRequest) returns (MerchantOrderActionResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/order/urge"
      body: "*"
    };
  }
  rpc MerchantOrderAppealSeller(MerchantOrderAppealRequest) returns (MerchantOrderActionResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/order/appeal-seller"
      body: "*"
    };
  }
  rpc MerchantOrderAppealBuyer(MerchantOrderAppealRequest) returns (MerchantOrderActionResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/order/appeal-buyer"
      body: "*"
    };
  }
  // 汇美支付：获取支付链接（买家）
  rpc MerchantOrderPay(MerchantOrderPayRequest) returns (MerchantOrderPayResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/order/pay"
      body: "*"
    };
  }

  // 商户订单 C2C 对话：发消息（首条自动建 merchant_session，WebSocket event: im.message.c2c）
  rpc MerchantChatSend(MerchantChatSendRequest) returns (MerchantChatSendResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/chat/send"
      body: "*"
    };
  }
  rpc MerchantChatUnread(MerchantChatUnreadRequest) returns (MerchantChatUnreadResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/chat/unread"
      body: "*"
    };
  }
  rpc MerchantChatSessionList(MerchantChatSessionListRequest) returns (MerchantChatSessionListResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/chat/session-list"
      body: "*"
    };
  }
  rpc MerchantChatMessageList(MerchantChatMessageListRequest) returns (MerchantChatMessageListResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/chat/message-list"
      body: "*"
    };
  }
  // 清除某商户会话未读（与 talk_mode=3、Redis im:unread 键一致；入参 receiver_id 为 session_id）
  rpc MerchantChatClearUnread(MerchantChatClearUnreadRequest) returns (MerchantChatClearUnreadResponse) {
    option (google.api.http) = {
      post: "/api/v1/merchant/chat/clear-unread"
      body: "*"
    };
  }
}

// 登录用户详情接口请求参数
message UserDetailRequest{}

// 登录用户详情接口响应参数
message UserDetailResponse{
  int32 id = 1 [(google.api.field_behavior) = REQUIRED];
  // 原 IM 系统用户 ID（user_id）
  int32 user_id = 9 [(google.api.field_behavior) = REQUIRED];
  // 登录用户名
  string username = 10 [(google.api.field_behavior) = REQUIRED];
  string mobile = 2 [(google.api.field_behavior) = REQUIRED];
  string nickname = 3 [(google.api.field_behavior) = REQUIRED];
  string avatar = 4 [(google.api.field_behavior) = REQUIRED];
  int32 gender = 5 [(google.api.field_behavior) = REQUIRED];
  string motto = 6 [(google.api.field_behavior) = REQUIRED];
  string email = 7 [(google.api.field_behavior) = REQUIRED];
  string birthday = 8 [(google.api.field_behavior) = REQUIRED];
  // 第三方 ID
  int32 uuid = 11 [(google.api.field_behavior) = REQUIRED];
  // u 卡用户唯一标识
  string user_code = 12 [(google.api.field_behavior) = REQUIRED];
  // 是否已设置交易密码（0/1）
  int32 is_trans = 13 [(google.api.field_behavior) = REQUIRED];
  string created_at = 14 [(google.api.field_behavior) = REQUIRED];
}

// 用户配置信息请求参数
message UserSettingRequest{}

// 用户配置信息响应参数
message UserSettingResponse{
  message UserInfo{
    int32 uid = 1 [(google.api.field_behavior) = REQUIRED];
    // 原 IM 系统用户 ID（user_id）
    int32 user_id = 9 [(google.api.field_behavior) = REQUIRED];
    // 登录用户名
    string username = 10 [(google.api.field_behavior) = REQUIRED];
    string nickname = 2 [(google.api.field_behavior) = REQUIRED];
    string avatar = 3 [(google.api.field_behavior) = REQUIRED];
    string motto = 4 [(google.api.field_behavior) = REQUIRED];
    int32 gender = 5 [(google.api.field_behavior) = REQUIRED];
    bool is_qiye = 6 [(google.api.field_behavior) = REQUIRED];
    string mobile = 7 [(google.api.field_behavior) = REQUIRED];
    string email = 8 [(google.api.field_behavior) = REQUIRED];
    // 第三方 ID
    int32 uuid = 11 [(google.api.field_behavior) = REQUIRED];
    // u 卡用户唯一标识
    string user_code = 12 [(google.api.field_behavior) = REQUIRED];
    // 是否已设置交易密码（0/1）
    int32 is_trans = 13 [(google.api.field_behavior) = REQUIRED];
  }

  message ConfigInfo{
    string theme_mode = 1 [(google.api.field_behavior) = REQUIRED];
    string theme_bag_img = 2 [(google.api.field_behavior) = REQUIRED];
    string theme_color = 3 [(google.api.field_behavior) = REQUIRED];
    string notify_cue_tone = 4 [(google.api.field_behavior) = REQUIRED];
    string keyboard_event_notify = 5 [(google.api.field_behavior) = REQUIRED];
  }

  UserInfo user_info = 1 [(google.api.field_behavior) = REQUIRED];
  ConfigInfo setting = 2 [(google.api.field_behavior) = REQUIRED];
}

// 用户信息更新接口请求参数
message UserDetailUpdateRequest{
  string avatar = 1;
  string nickname = 2 [(buf.validate.field).string.max_len = 30];
  int32 gender = 3 [(buf.validate.field).int32 = {in:[0, 1, 2, 3]}];
  string motto = 4 [(buf.validate.field).string.max_len = 255];
  string birthday = 5;
}

// 用户信息更新接口响应参数
message UserDetailUpdateResponse{}

// 用户密码更新接口请求参数
message UserPasswordUpdateRequest{
  string old_password = 1 [(buf.validate.field).string.min_len = 1];
  string new_password = 2 [(buf.validate.field).string.min_len = 1];
}

// 用户密码更新接口响应参数
message UserPasswordUpdateResponse{}

// 用户手机号更新接口请求参数
message UserMobileUpdateRequest{
  string mobile = 1 [(buf.validate.field).string.min_len = 1];
  string password = 2 [(buf.validate.field).string.min_len = 1];
  string sms_code = 3 [(buf.validate.field).string.len = 6];
}

// 用户手机号更新接口响应参数
message UserMobileUpdateResponse{}

// 用户邮箱更新接口请求参数
message UserEmailUpdateRequest{
  string email = 1 [(buf.validate.field).string.min_len = 1];
  string password = 2 [(buf.validate.field).string.min_len = 1];
  string code = 3 [(buf.validate.field).string.len = 6];
}

// 用户邮箱更新接口响应参数
message UserEmailUpdateResponse{}

// 商户申请请求
message MerchantApplyRequest {
  string nickname = 1 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  string realname = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  string nation = 3 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  int32 id_type = 4 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
  string idcard = 5 [(buf.validate.field).string = {min_len: 1, max_len: 30}];
  string image = 6 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string back_image = 7 [(buf.validate.field).string.max_len = 255];
  // 保证金（元），最低 500；提交时会调用钱包冻结接口
  double surety = 8 [(buf.validate.field).double = {gte: 500}];
  // 交易密码（必填，与 users.salt + trans 校验）
  string password = 9 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message MerchantApplyResponse {
  int32 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message MerchantStatusRequest {}

message MerchantProfileRequest {}

message MerchantPayTypeLimit {
  double min = 1;
  double max = 2;
}

message MerchantStatusResponse {
  bool has_application = 1 [(google.api.field_behavior) = REQUIRED];
  int32 id = 2;
  string nickname = 3;
  string realname = 4;
  string nation = 5;
  int32 id_type = 6;
  string idcard = 7;
  string image = 8;
  string back_image = 9;
  double surety = 10;
  int32 status = 11;
  string reason = 12;
  int32 is_limit = 13;
  int32 limit_time = 14;
  int32 is_frozen = 15;
  int32 frozen_time = 16;
  int32 is_close = 17;
  string created_at = 18;
  string updated_at = 19;
  // 已开通支付类型及金额区间，如 {"hd":{"min":200,"max":10000}}，依据 pay_types JSON 中 pay_type 映射
  map<string, MerchantPayTypeLimit> pay_types = 20;
}

// 买家查看挂单对应商户的公开信息
message MerchantInfoByTaskRequest {
  int32 task_id = 1 [(buf.validate.field).int32.gt = 0];
}

message MerchantInfoForBuyerResponse {
  int32 task_id = 1 [(google.api.field_behavior) = REQUIRED];
  string nickname = 2 [(google.api.field_behavior) = REQUIRED];
  map<string, MerchantPayTypeLimit> pay_types = 3;
}

// ---------- 商户挂售任务 merchant_task ----------

message MerchantTaskItem {
  int32 id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 user_id = 2 [(google.api.field_behavior) = REQUIRED];
  int32 currency_type = 3 [(google.api.field_behavior) = REQUIRED];
  double price = 4 [(google.api.field_behavior) = REQUIRED];
  double sell_count = 5 [(google.api.field_behavior) = REQUIRED];
  string paytype = 6;
  int32 status = 7 [(google.api.field_behavior) = REQUIRED];
  int32 is_up = 8 [(google.api.field_behavior) = REQUIRED];
  int32 up_time = 9 [(google.api.field_behavior) = REQUIRED];
  int32 is_deleted = 10 [(google.api.field_behavior) = REQUIRED];
  string created_at = 11;
  string updated_at = 12;
  // 原总出售数量（创建时与 sell_count 一致，出售过程中不变）
  double sell_total = 13 [(google.api.field_behavior) = REQUIRED];
  // 挂单商户昵称（merchant.nickname，已审核通过记录）
  string merchant_nickname = 14;
}

message MerchantTaskCreateRequest {
  int32 currency_type = 1 [(buf.validate.field).int32 = {in: [1]}];
  double price = 2 [(buf.validate.field).double = {gt: 0}];
  double sell_count = 3 [(buf.validate.field).double = {gt: 0}];
  string paytype = 4 [(buf.validate.field).string.max_len = 1024];
}

message MerchantTaskCreateResponse {
  int32 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message MerchantTaskMyListRequest {
  int32 page = 1;
  int32 page_size = 2;
  // 上下架筛选：0-不限（默认），1-已上架，2-已下架
  int32 is_up = 3 [(buf.validate.field).int32 = {in: [0, 1, 2]}];
  // 任务状态：0-待交易，1-交易中，2-完成交易；不传则不按 status 筛选
  optional int32 status = 4 [(buf.validate.field).int32 = {gte: 0, lte: 2}];
}

message MerchantTaskMarketListRequest {
  // 页码，从 1 开始；未传或 0 时服务端按 1 处理
  int32 page = 1 [(buf.validate.field).int32.gte = 0];
  // 每页条数；未传或 0 时默认 20，最大 100
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
}

message MerchantTaskListResponse {
  repeated MerchantTaskItem items = 1;
  int32 total = 2 [(google.api.field_behavior) = REQUIRED];
}

message MerchantTaskDetailRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message MerchantTaskUpdateRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
  int32 currency_type = 2 [(buf.validate.field).int32 = {in: [1]}];
  double price = 3 [(buf.validate.field).double = {gt: 0}];
  double sell_count = 4 [(buf.validate.field).double = {gt: 0}];
  string paytype = 5 [(buf.validate.field).string.max_len = 1024];
}

message MerchantTaskUpdateResponse {}

message MerchantTaskIdRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message MerchantTaskActionResponse {}

// ---------- 商户收款方式 merchant_paytype ----------

message MerchantPaytypeItem {
  int32 id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 user_id = 2 [(google.api.field_behavior) = REQUIRED];
  int32 type_id = 3 [(google.api.field_behavior) = REQUIRED];
  string account = 4;
  string nickname = 5;
  string open_bank = 6;
  int32 is_delete = 7 [(google.api.field_behavior) = REQUIRED];
  string created_at = 8;
  string updated_at = 9;
  string phone = 10;
}

message MerchantPaytypeCreateRequest {
  int32 type_id = 1 [(buf.validate.field).int32 = {gte: 1, lte: 127}];
  string account = 2 [(buf.validate.field).string.max_len = 100];
  string nickname = 3 [(buf.validate.field).string.max_len = 100];
  string open_bank = 4 [(buf.validate.field).string.max_len = 255];
  // 手机号，选填
  string phone = 5 [(buf.validate.field).string.max_len = 16];
}

message MerchantPaytypeCreateResponse {
  int32 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message MerchantPaytypeUpdateRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
  int32 type_id = 2 [(buf.validate.field).int32 = {gte: 1, lte: 127}];
  string account = 3 [(buf.validate.field).string.max_len = 100];
  string nickname = 4 [(buf.validate.field).string.max_len = 100];
  string open_bank = 5 [(buf.validate.field).string.max_len = 255];
}

message MerchantPaytypeUpdateResponse {}

message MerchantPaytypeListRequest {}

message MerchantPaytypeListResponse {
  repeated MerchantPaytypeItem items = 1;
}

message MerchantPaytypeInvalidateRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message MerchantPaytypeInvalidateResponse {}

// ---------- 商户订单 merchant_order ----------

// 订单列表项（列表页展示必要字段）
message MerchantOrderListItem {
  int32 id = 1;
  string order_id = 2;
  int32 buyer_id = 3;
  int32 saler_id = 4;
  double amount = 5;
  int32 task_id = 6;
  double counts = 7;
  string pay_type_info = 8;
  int32 buy_type = 9;
  int32 status = 10;
  int32 is_cancel = 11;
  int32 is_appeal = 12;
  string created_at = 13;
  int32 wronger = 14;
  string judge = 15;
  string judge_time = 16;
  // 卖方商户昵称（merchant.nickname，已审核通过记录）
  string merchant_nickname = 17;
  // 支付类型：1-支付宝，2-微信，3-银行卡，4-宏达，5-汇美
  int32 pay_type_id = 18;
  // 申诉材料文件 URL 列表
  repeated string appeal_materials = 19;
  // 订单取消原因
  string cancel_reason = 20;
  // 下单备注
  string remark = 21;
}

message MerchantOrderItem {
  int32 id = 1;
  string order_id = 2;
  int32 buyer_id = 3;
  int32 saler_id = 4;
  double amount = 5;
  int32 task_id = 6;
  double counts = 7;
  string pay_type_info = 8;
  int32 buy_type = 9;
  int32 status = 10;
  string pay_img = 11;
  int32 is_cancel = 12;
  int32 is_appeal = 13;
  int32 appeal_id = 14;
  int32 appeal_time = 15;
  string appeal_reason = 16;
  int32 cancel_id = 17;
  string cancel_reason = 18;
  int32 pay_time = 19;
  int32 cancel_time = 20;
  int32 wronger = 21;
  string judge = 22;
  string judge_time = 23;
  string created_at = 24;
  string updated_at = 25;
  // 支付类型：1-支付宝，2-微信，3-银行卡，4-宏达，5-汇美
  int32 pay_type_id = 26;
  // 申诉材料文件 URL 列表
  repeated string appeal_materials = 27;
  // 下单备注
  string remark = 28;
  // 对方 users 表头像（买家看卖家，卖家看买家）
  string avatar = 29;
  // 对方 users 表昵称
  string nickname = 30;
}

message MerchantOrderCreateRequest {
  int32 task_id = 1 [(buf.validate.field).int32.gt = 0];
  double counts = 2 [(buf.validate.field).double = {gt: 0}];
  // 支付信息 JSON 字符串
  string pay_type_info = 3 [(buf.validate.field).string.max_len = 255];
  int32 buy_type = 4;
  // 支付类型：1-支付宝，2-微信，3-银行卡，4-宏达，5-汇美
  int32 pay_type_id = 5 [(buf.validate.field).int32 = {gte: 1, lte: 5}];
  // 下单备注，选填
  string remark = 6 [(buf.validate.field).string.max_len = 255];
}

message MerchantOrderCreateResponse {
  int32 id = 1 [(google.api.field_behavior) = REQUIRED];
  string order_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message MerchantOrderDetailRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message MerchantOrderCancelRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
  int32 cancel_id = 2 [(buf.validate.field).int32.gte = 0];
  string cancel_reason = 3 [(buf.validate.field).string.max_len = 255];
}

message MerchantOrderIdRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message MerchantOrderConfirmPayRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
  string pay_img = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
}

message MerchantOrderAppealRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
  string appeal_reason = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  // 申诉材料文件 URL 列表，入库为 JSON 数组
  repeated string appeal_materials = 3;
}

message MerchantOrderListRequest {
  // 1-买家订单（默认），2-卖家订单
  int32 direct = 1 [(buf.validate.field).int32 = {in: [0, 1, 2]}];
  int32 page = 2 [(buf.validate.field).int32.gte = 0];
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  // 订单状态筛选，多个用英文逗号分隔：0待支付 1已支付待放币 2已完成 3已取消；空表示不限
  string status = 4 [(buf.validate.field).string.max_len = 64];
  // 申诉筛选：1 表示申诉中未裁定（is_appeal=1 且 judge_time=0）；0 或不传表示不限
  int32 is_appeal = 5 [(buf.validate.field).int32 = {in: [0, 1]}];
}

message MerchantOrderListResponse {
  repeated MerchantOrderListItem items = 1;
  int32 total = 2 [(google.api.field_behavior) = REQUIRED];
}

message MerchantOrderActionResponse {}

message MerchantOrderPayRequest {
  // 商户订单号（merchant_order.order_id）
  string order_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string return_url = 2 [(buf.validate.field).string.max_len = 512];
}

message MerchantOrderPayResponse {
  string pay_url = 1 [(google.api.field_behavior) = REQUIRED];
}

// ---------- 商户订单 C2C 对话 merchant_session / merchant_message ----------

message MerchantChatSendRequest {
  int32 order_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 msg_type = 2 [(buf.validate.field).int32.gt = 0];
  string extra = 3 [(buf.validate.field).string.max_len = 8192];
  string quote = 4 [(buf.validate.field).string.max_len = 8192];
  string msg_id = 5;
}

message MerchantChatSendResponse {
  int64 message_db_id = 1 [(google.api.field_behavior) = REQUIRED];
  string msg_id = 2 [(google.api.field_behavior) = REQUIRED];
  int32 session_id = 3 [(google.api.field_behavior) = REQUIRED];
}

message MerchantChatUnreadRequest {
  // 商户订单号（merchant_order.order_id，与创建订单接口返回的 order_id 字符串一致），非自增主键 id
  string order_no = 1 [(buf.validate.field).string.min_len = 1];
}

message MerchantChatUnreadResponse {
  // 当前用户在该订单对应商户会话下的未读条数（无会话时为 0）
  int32 total_unread = 1 [(google.api.field_behavior) = REQUIRED];
}

message MerchantChatSessionListRequest {}

message MerchantChatSessionItem {
  int32 session_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 order_id = 2 [(google.api.field_behavior) = REQUIRED];
  int32 peer_user_id = 3 [(google.api.field_behavior) = REQUIRED];
  string peer_nickname = 4;
  string peer_avatar = 5;
  string last_preview = 6;
  string updated_at = 7;
  // 当前用户在该商户会话下的未读条数（Redis，与 MerchantChatUnread 汇总口径一致）
  int32 unread_num = 8;
}

message MerchantChatSessionListResponse {
  repeated MerchantChatSessionItem items = 1;
}

message MerchantChatMessageListRequest {
  // 对手方用户 id（与 /api/v1/message/records 的 receiver_id 一致）
  int32 receiver_id = 1 [(buf.validate.field).int32.gt = 0];
  // 游标：首次传 0；翻页传上一页最后一条消息的 id
  int32 cursor = 2;
  int32 limit = 3 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
}

message MerchantChatMessageItem {
  int64 id = 1;
  string msg_id = 2;
  string org_msg_id = 3;
  int32 session_id = 4;
  int32 msg_type = 5;
  int32 user_id = 6;
  int32 receiver_id = 7;
  int32 from_id = 8;
  int32 is_revoked = 9;
  int32 is_deleted = 10;
  string extra = 11;
  string quote = 12;
  string send_time = 13;
  string created_at = 14;
}

message MerchantChatMessageListResponse {
  repeated MerchantChatMessageItem items = 1;
  // 下一页游标；为 0 表示没有更多历史消息
  int32 cursor = 2 [(google.api.field_behavior) = REQUIRED];
}

message MerchantChatClearUnreadRequest {
  int32 session_id = 1 [(buf.validate.field).int32.gt = 0];
}

message MerchantChatClearUnreadResponse {}
